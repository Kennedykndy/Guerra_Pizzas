<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastrar Pizza - Bella Napoli</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">
          <i class="fa-solid fa-pizza-slice text-warning me-2"></i>
          Bella Napoli
        </a>
      </div>
    </nav>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h3 text-center fw-bold mb-4">
                Cadastrar Pizza
              </h1>

              <form id="pizza-form">
                <div class="mb-3">
                  <label for="nome" class="form-label">
                    Nome
                  </label>

                  <input
                    type="text"
                    id="nome"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="descricao" class="form-label">
                    Descrição
                  </label>

                  <textarea
                    id="descricao"
                    class="form-control"
                    rows="3"
                  ></textarea>
                </div>

                <div class="mb-3">
                  <label for="preco" class="form-label">
                    Preço
                  </label>

                  <input
                    type="number"
                    id="preco"
                    class="form-control"
                    min="0"
                    step="0.01"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="categoria" class="form-label">
                    Categoria
                  </label>

                  <input
                    type="text"
                    id="categoria"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label for="disponivel" class="form-label">
                    Disponível
                  </label>

                  <select id="disponivel" class="form-select">
                    <option value="1">Sim</option>
                    <option value="0">Não</option>
                  </select>
                </div>

                <button
                  type="submit"
                  class="btn btn-success w-100"
                >
                  <i class="fa-solid fa-plus me-2"></i>
                  Cadastrar Pizza
                </button>
              </form>

              <div id="mensagem" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="assets/cadastro-pizza.js"></script>
  </body>
</html>
