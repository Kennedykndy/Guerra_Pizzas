```html
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pizzaria Bella Napoli - Cardápio Online</title>

    <!-- Bootstrap 5 - Folha de estilos CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Ícones do Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Folha de estilos personalizada -->
    <link rel="stylesheet" href="assets/style.css" />
  </head>

  <body class="bg-light">
    <!-- Barra de navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">
          <i class="fa-solid fa-pizza-slice text-warning me-2"></i>
          Bella Napoli
        </a>

        <button
          class="btn btn-warning position-relative"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#cartOffcanvas"
          aria-controls="cartOffcanvas"
        >
          <i class="fa-solid fa-cart-shopping"></i>
          Carrinho

          <span
            id="cart-badge"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          >
            0
          </span>
        </button>
      </div>
    </nav>

    <!-- Seção principal de apresentação -->
    <header class="hero-section text-center">
      <div class="container">
        <h1 class="display-4 fw-bold">As Melhores Pizzas Artesanais</h1>

        <p class="lead">Peça online e receba quentinha na sua casa!</p>
      </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="container my-5">
      <h2 class="mb-4 text-center fw-bold">Nosso Cardápio</h2>

      <!--
        Os cards das pizzas serão carregados
        automaticamente pela API através do script.js.
      -->
      <div class="row g-4" id="menu-items"></div>
    </main>

    <!-- Carrinho lateral -->
    <div
      class="offcanvas offcanvas-end"
      tabindex="-1"
      id="cartOffcanvas"
      aria-labelledby="cartOffcanvasLabel"
    >
      <div class="offcanvas-header bg-dark text-white">
        <h5 class="offcanvas-title" id="cartOffcanvasLabel">
          <i class="fa-solid fa-cart-shopping me-2"></i>
          Seu Carrinho
        </h5>

        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="offcanvas"
          aria-label="Fechar"
        ></button>
      </div>

      <div class="offcanvas-body d-flex flex-column justify-content-between">
        <div>
          <ul id="cart-items" class="list-group list-group-flush mb-3">
            <!-- Os itens do carrinho serão adicionados pelo JavaScript -->

            <li class="list-group-item text-center text-muted">
              Seu carrinho está vazio.
            </li>
          </ul>
        </div>

        <div>
          <div
            class="d-flex justify-content-between fw-bold fs-5 mb-3 border-top pt-2"
          >
            <span>Total:</span>

            <span id="cart-total" class="text-success"> R$ 0,00 </span>
          </div>

          <button
            class="btn btn-success w-100 py-2 fw-bold"
            onclick="checkout()"
          >
            Finalizar Pedido
          </button>
        </div>
      </div>
    </div>

    <!-- Rodapé -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
      <div class="container">
        <p class="mb-0">
          &copy; 2026 Pizzaria Bella Napoli. Todos os direitos reservados.
        </p>
      </div>
    </footer>

    <!-- Bootstrap 5 - Código JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica personalizada da aplicação -->
    <script src="assets/script.js"></script>
  </body>
</html>
```
